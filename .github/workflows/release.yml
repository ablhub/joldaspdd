name: Release
# Автоматический выпуск: после зеленого CI на ветке main собирается подписанный релиз и публикуется на GitHub
# с тегом v<версия сборки>. Сервер сам раз в 10 минут проверяет последний релиз и ставит его, если версия новее
# (админка, Настройки, Автообновление; репозиторий должен быть публичным). Подпись ставится ключом из секрета RELEASE_SIGNING_KEY, см. docs/DEPLOY.md.
# Ручной запуск (Actions, Release, Run workflow) собирает релиз с выбранной ветки без ожидания CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # только результаты push в main: запуски из форков и pull request релиз не выпускают
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ключ подписи на месте
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::Нет секрета RELEASE_SIGNING_KEY, инструкция в docs/DEPLOY.md"; exit 1; }
          node tools/release_key.js --check
      - name: Зависимости
        run: |
          npm ci --prefix server
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Сборка и подпись релиза
        env:
          RELEASE_KEY_PEM: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node tools/build_release.js release-out
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          VERSION=$(cat release-out/VERSION)
          TAG="v$VERSION"
          gh release create "$TAG" release-out/joldas-release.signed \
            --target "$SHA" --latest \
            --title "$VERSION" \
            --notes "Подписанный релиз сайта $VERSION. Сервер установит его сам при очередной проверке (раз в 10 минут). Вручную: админка, Настройки, Обновление сайта."
